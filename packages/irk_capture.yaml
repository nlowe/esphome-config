logger:
  # Bluetooth events log from the NimBLE task in bursts of a dozen lines. The
  # 768-byte default drops the last lines of a capture from the network log.
  task_log_buffer_size: 2048

# Component irk_capture cannot be used together with component esp32_ble.
esp32_ble: !remove
bluetooth_proxy: !remove

external_components:
  - source: github://DerekSeaman/irk-capture@main
    components:
      - irk_capture

irk_capture:
  id: irk
  ble_name: "IRK Capture"
  start_on_boot: true
  continuous_mode: true
  max_captures: 10
  # Fires a Home Assistant event (esphome.irk_captured) once per capture. In HA,
  # enable "Allow the device to perform Home Assistant actions" for this device.
  on_capture:
    - homeassistant.event:
        event: esphome.irk_captured
        data:
          irk: !lambda "return irk;"
          mac: !lambda "return mac;"
          verification: !lambda "return verification;"

text_sensor:
  - platform: irk_capture
    irk_capture_id: irk
    last_irk:
      name: "IRK"
      id: last_irk
    last_address:
      name: "Device BLE MAC"
      id: last_addr
    irk_check:
      name: "IRK Check"
      id: irk_check
      icon: mdi:shield-check
    effective_mac:
      name: "ESP32 BLE MAC"
      id: effective_mac
    status:
      name: "Status"
      id: capture_status
      icon: mdi:bluetooth-connect

# Persistent BLE advertising intent (pauses automatically while connected)
switch:
  - platform: irk_capture
    irk_capture_id: irk
    advertising:
      id: ble_advertising
      name: "BLE Advertising"
      # Preserve start_on_boot; an explicit restore mode can override it.
      restore_mode: DISABLED

button:
  - platform: irk_capture
    irk_capture_id: irk
    refresh_identity:
      id: refresh_identity_btn
      name: "Refresh BLE Identity"
      icon: mdi:bluetooth-settings
  - platform: restart
    name: "Restart Device"

text:
  - platform: irk_capture
    irk_capture_id: irk
    ble_name:
      id: ble_name_input
      name: "BLE Device Name"
      mode: text

select:
  - platform: irk_capture
    irk_capture_id: irk
    ble_profile:
      id: ble_profile_select
      name: "BLE Profile"
      # Options: "Heart Sensor" or "Keyboard" (default set in code)
